services:
  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    init: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      DB_NAME: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
