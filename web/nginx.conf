server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. Using a variable makes nginx look up "api" per request, so it
    # starts without the API and follows the new IP when the container is recreated.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
    }
}
