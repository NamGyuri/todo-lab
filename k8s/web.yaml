apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: todo-3tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: todo3tier-web:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: todo-3tier
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
