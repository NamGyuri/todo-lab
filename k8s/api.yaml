apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: todo-3tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # The Service named "db" would otherwise inject DB_PORT=tcp://<ip>:5432.
      enableServiceLinks: false
      # Same role as "init: true" in compose.yaml: node is not PID 1, so it stops on SIGTERM.
      shareProcessNamespace: true
      containers:
        - name: api
          image: todo3tier-api:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: db-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
          # server.js retries the DB and only listens once it answers, so allow
          # up to 5 minutes for a late DB before restarting the container.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 60
          # Goes through the DB, so traffic stops while the DB is unreachable.
          readinessProbe:
            httpGet:
              path: /api/todos
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 6
          # TCP only: a DB outage should not restart the API.
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: todo-3tier
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
